<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Roy L. Clay Sr. - Biografia</title>
	<style>
        /* Estilos globais da página */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Estilo do contêiner principal (o "cartão" branco) */
        .cartao {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            box-sizing: border-box;
        }

        /* Estilo do título */
        h1 {
            color: #1a365d;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        /* Estilo do texto/parágrafo */
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #4a5568;
            text-align: justify;
            margin-bottom: 30px;
        }

        /* Estilo da imagem */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 3px solid #edf2f7;
            transition: transform 0.3s ease;
        }

        /* Efeito de hover (passar o mouse) na imagem */
        img:hover {
            transform: scale(1.02);
        }

        /* Ajustes para telas menores (celulares) */
        @media (max-width: 480px) {
            .cartao {
                padding: 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
	</style>
</head>

<body>

    <div class="cartao">
        <h1>Roy L. Clay Sr.</h1>
        
        <p>
            Foi um cientista afro-americano da computação e inventor. Ele foi um dos membros da Hewlett-Packard onde liderou a equipe que criou o minicomputador HP 2116A de 16 bits. Nascido em 22 de agosto de 1929, falecido em 22 de setembro de 2024.
        </p>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZ3Mji2WlRBiVpKeBJiv8i-mM6WaoxmkGbqWpsSNBp7yJnvXKnOa0ZRIyWWXHaQJBMdiwj2GhrQE3biiIwLYYHuFBXQvF7cCMgiNKjMhrTQw&s=10" alt="Retrato de Roy L. Clay Sr.">
    </div>

</body>
</html>
